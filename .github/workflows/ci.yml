name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, "lab*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install flake8
      - name: Run flake8
        run: flake8 src/ main.py --max-line-length=100 --statistics --count

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests with coverage
        run: |
          pytest tests/ -v \
            --cov=src \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            --junitxml=junit.xml
      - name: Upload coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov/
      - name: Upload JUnit report
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: junit.xml

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit dependencies
        run: pip-audit -r requirements.txt

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-xml
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: lms:latest
      - name: Smoke test
        run: |
          docker run -d -p 5000:5000 --name lms-smoke lms:latest
          sleep 5
          curl -f http://localhost:5000/health
          docker stop lms-smoke

  integration:
    name: Integration Stack Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Run full API workflow
        run: |
          python main.py &
          sleep 3
          # Register teacher
          curl -sf -X POST http://localhost:5000/users \
            -H "Content-Type: application/json" \
            -d '{"name":"Integration Teacher","email":"int_t@t.com","password":"pass123","role":"teacher"}'
          # Register student
          curl -sf -X POST http://localhost:5000/users \
            -H "Content-Type: application/json" \
            -d '{"name":"Integration Student","email":"int_s@t.com","password":"pass123"}'
          # Create + publish course
          COURSE=$(curl -sf -X POST http://localhost:5000/courses \
            -H "Content-Type: application/json" \
            -d '{"title":"Integration Course","description":"Full integration test course","teacher_id":1,"category":"test"}')
          echo "$COURSE"
          curl -sf -X POST http://localhost:5000/courses/1/publish
          # Enroll student
          curl -sf -X POST http://localhost:5000/enrollments \
            -H "Content-Type: application/json" \
            -d '{"user_id":2,"course_id":1}'
          echo "Integration test passed"

  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    needs: integration
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/lms:latest
            ghcr.io/${{ github.repository }}/lms:${{ github.sha }}
